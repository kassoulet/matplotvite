[workspace]
members = [
    "crates/matplotvite-core",
    "crates/matplotvite",
    "crates/matplotvite-py",
]
resolver = "2"

[workspace.package]
version = "0.6.1-dev"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kassoulet/matplotvite"

[workspace.dependencies]
ndarray = "0.16"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"

[profile.release]
# Measured on the release wheels: fat LTO with a single codegen unit renders
# about 9% faster and shrinks the wheel by 16% versus the default release
# profile (opt-level 3, 16 units, no LTO). The cost is build time, which the
# wheel matrix pays once per platform.
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
# The renderer is deliberately safe Rust; keep it that way.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
