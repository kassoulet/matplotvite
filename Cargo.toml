[package]
name = "matplotvite"
version = "0.5.0"
edition = "2021"
description = "Matplotlib-style static plots rendered in Rust, with numpy as the only Python dependency"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kassoulet/matplotvite"
readme = "README.md"
keywords = ["matplotlib", "plotting", "charts", "svg", "pyo3"]
categories = ["visualization", "api-bindings"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
png = "0.18"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "svg_backend", "line_series", "ab_glyph"] }
plotters-backend = "0.3"
resvg = "0.49.0"
usvg = "0.49.0"
tiny-skia = "0.12.0"
svg2pdf = "0.13"
pdf-writer = "0.12"
webp = "0.3"
rayon = "1.10"
ab_glyph = "0.2"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "render"
harness = false
