[package]
name = "matplotvite-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python extension module for matplotvite"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = []

[dependencies]
matplotvite-core = { version = "0.7.0", path = "../matplotvite-core", features = ["python"] }
pyo3 = { workspace = true }
numpy = { workspace = true }

[lints]
workspace = true
