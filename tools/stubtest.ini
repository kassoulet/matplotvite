# Configuration for `mypy.stubtest` only. It cannot reuse pyproject.toml: the
# stubs are installed against the running interpreter, while the package config
# targets Python 3.9, and numpy's stubs (imported by the runtime package) use
# syntax that a 3.9 target rejects. These two settings keep the compile clean
# without changing what stubtest compares.
[mypy]
ignore_missing_imports = true
disable_error_code = annotation-unchecked
