name: Publish

on:
  push:
    tags:
      - "v*"
  # Re-run an interrupted upload for an existing tag without tagging again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare the tag with the version in pyproject.toml, Cargo.toml and Cargo.lock
        # PyPI rejects a duplicate version, so a mistyped tag would build every
        # wheel and only fail at the upload. Stop before the matrix starts, and
        # make sure the three manifests agree so the published metadata is not
        # split between different versions.
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          def load(path):
              return tomllib.loads(pathlib.Path(path).read_text())

          tag = os.environ["GITHUB_REF_NAME"]
          wanted = tag[1:] if tag.startswith("v") else tag
          cargo = load("Cargo.toml")["package"]
          locked = next(
              (item["version"] for item in load("Cargo.lock")["package"] if item["name"] == cargo["name"]),
              None,
          )
          if locked is None:
              sys.exit(f"{cargo['name']} is missing from Cargo.lock")
          versions = {
              "pyproject.toml": load("pyproject.toml")["project"]["version"],
              "Cargo.toml": cargo["version"],
              "Cargo.lock": locked,
          }
          mismatched = {path: version for path, version in versions.items() if version != wanted}
          if mismatched:
              found = ", ".join(f"{path} says {version}" for path, version in mismatched.items())
              sys.exit(f"tag {tag} does not match: {found}")
          print(f"tag {tag} matches " + ", ".join(f"{path} {version}" for path, version in versions.items()))
          PY

  wheels:
    name: wheel (${{ matrix.name }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            interpreter: python
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            interpreter: python
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Same stable-ABI wheel as CI: one cp39-abi3 build serves every
          # interpreter above 3.9, so the matrix only varies by platform.
          args: --release --out dist --interpreter ${{ matrix.interpreter }}
      - name: Build the sdist
        # The tarball is platform independent, so exactly one job builds it.
        if: matrix.name == 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    # Must match the environment name registered in the PyPI trusted publisher.
    environment: pypi
    permissions:
      # PyPI trusted publishing exchanges this OIDC token for a short-lived key.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Upload the wheels and sdist to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          # Re-runs after a partial upload keep the files PyPI already has.
          args: --skip-existing --non-interactive dist/*
