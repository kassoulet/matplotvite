name: Publish

on:
  push:
    tags:
      - "v*"
  # Re-run an interrupted upload for an existing tag without tagging again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an upload halfway through, but do not start a second release
  # for the same tag while one is still running.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compare the tag with the version in Cargo.toml and Cargo.lock
        # Cargo.toml is the single version source and maturin reads it through
        # pyproject.toml's dynamic metadata. PyPI rejects a duplicate version,
        # so a mistyped tag would build every wheel and only fail at the upload.
        # Stop before the matrix starts, and make sure the manifests agree so
        # the published metadata is not split between different versions.
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          def load(path):
              return tomllib.loads(pathlib.Path(path).read_text())

          tag = os.environ["GITHUB_REF_NAME"]
          wanted = tag[1:] if tag.startswith("v") else tag
          project = load("pyproject.toml")["project"]
          if "version" in project or project.get("dynamic") != ["version"]:
              sys.exit("pyproject.toml must declare dynamic = [\"version\"] and no static version")
          # The workspace owns the version; maturin builds the extension crate.
          workspace_version = load("Cargo.toml")["workspace"]["package"]["version"]
          crate = "matplotvite-py"
          locked = next(
              (item["version"] for item in load("Cargo.lock")["package"] if item["name"] == crate),
              None,
          )
          if locked is None:
              sys.exit(f"{crate} is missing from Cargo.lock")
          versions = {
              "Cargo.toml": workspace_version,
              "Cargo.lock": locked,
          }
          mismatched = {path: version for path, version in versions.items() if version != wanted}
          if mismatched:
              found = ", ".join(f"{path} says {version}" for path, version in mismatched.items())
              sys.exit(f"tag {tag} does not match: {found}")
          print(f"tag {tag} matches " + ", ".join(f"{path} {version}" for path, version in versions.items()))
          PY

  tests:
    name: test matrix
    needs: check-version
    # ci.yml is reusable. Reusing it keeps the release gate identical to the
    # pull-request and main checks instead of maintaining a second list.
    uses: ./.github/workflows/ci.yml

  wheels:
    name: wheel (${{ matrix.name }})
    needs: [check-version, tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            interpreter: ""
          - name: musllinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            interpreter: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            interpreter: python
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            interpreter: python
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Same stable-ABI wheel as CI: one cp39-abi3 build serves every
          # interpreter above 3.9, so the matrix only varies by platform.
          # musllinux cross images autodetect Python; manylinux needs it named.
          args: --release --out dist ${{ matrix.interpreter && format('--interpreter {0}', matrix.interpreter) || '' }}
      - name: Build the sdist
        # The tarball is platform independent, so exactly one job builds it.
        if: matrix.name == 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI and GitHub
    needs: wheels
    runs-on: ubuntu-latest
    # Must match the environment name registered in the PyPI trusted publisher.
    environment: pypi
    permissions:
      # PyPI trusted publishing exchanges this OIDC token for a short-lived key.
      id-token: write
      # The same job records the GitHub release after the upload succeeds.
      contents: write
      # Build provenance is attached to the wheel and sdist before upload.
      attestations: write
    steps:
      # The pinned requirement files below live in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Validate the package metadata
        # twine parses the metadata every index will read; catch a broken
        # README, classifier or licence file before the upload starts.
        run: |
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python -m twine check dist/*
      # The upload set spans every platform, but the smoke test runs on Linux,
      # so it installs the Linux wheel by path instead of letting pip choose.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: smoke-dist
      - name: Smoke-test the installed wheel
        # Build the wheel in a clean environment, then import it and render once.
        # This catches shipping mistakes that a source-tree test cannot see.
        run: |
          python -m venv smoke
          . smoke/bin/activate
          python -m pip install --require-hashes -r .github/requirements/runtime.txt
          python -m pip install --no-index --no-deps smoke-dist/*.whl
          cd smoke
          python - <<'PY'
          import matplotvite
          import matplotvite as plt

          plt.figure((3, 2))
          plt.plot([0, 1], [1, 0])
          png = plt.savefig(format="png")
          assert png.startswith(b"\x89PNG\r\n\x1a\n"), png[:8]
          print(f"matplotvite {matplotvite.__version__} rendered {len(png)} PNG bytes")
          PY
      - name: Attest wheel and sdist provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload the wheels and sdist to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          # Re-runs after a partial upload keep the files PyPI already has.
          args: --skip-existing --non-interactive dist/*
      - name: Create or update the GitHub release
        # Only a tagged run names a release; a manual PyPI re-upload must not
        # invent one for the branch it happened to run from.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run after a partial release must upload to the existing one
          # instead of failing on the duplicate tag.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

  sbom:
    name: SBOM
    needs: publish
    # A manual dispatch has no GitHub release to attach the SBOM to.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Generate and attach an SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: dist
          format: spdx-json
          output-file: dist/matplotvite-${{ github.ref_name }}.spdx.json
          artifact-name: matplotvite-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-release-assets: true
