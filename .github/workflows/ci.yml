name: CI

on:
  push:
  pull_request:
  # The release workflow calls this reusable workflow so a tag cannot publish
  # before the same test matrix that guards main has passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      # The prek action runs pre-commit hooks only; Rust tests moved to the
      # pre-push stage, so CI runs them here to keep them covered.
      - name: Rust tests
        run: cargo test --all-targets
      - name: Rust tests without Python
        run: |
          cargo test -p matplotvite-core --no-default-features
          cargo clippy -p matplotvite-core --no-default-features --all-targets -- -D warnings
      - name: Build the fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Type-check the Python package
        run: |
          python -m pip install -c .github/requirements-ci.txt mypy
          python -m mypy

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Check the non-Python line coverage
        run: cargo llvm-cov -p matplotvite-core --all-targets --no-default-features --summary-only --fail-under-lines 45

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the minimum supported Rust version
        run: cargo check --locked --all-targets --all-features

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: Check advisories, licences, bans, duplicates and sources
        # cargo-deny owns the repository policy, including yanked crates.
        run: cargo deny check

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run dependency and static security checks
        run: |
          python -m pip install -c .github/requirements-ci.txt "pip-audit>=2.9" bandit
          python tools/security_audit.py

  wheels:
    name: wheel (${{ matrix.name }})
    # Release artifacts are only worth minutes of runner time once the code is
    # known to compile and lint. The suite runs once, against the built wheel
    # (wheel-tests), instead of a second time on a `maturin develop` build.
    needs: prek
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform only on tags and release/ branches; other refs build
        # the linux-x86_64 wheel (also the sdist) to keep the wheel tests alive.
        include: ${{ fromJSON(
          (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/'))
          && '[{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","manylinux":"auto","interpreter":"python3.13"},{"name":"linux-aarch64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","manylinux":"auto","interpreter":"python3.13"},{"name":"musllinux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","manylinux":"musllinux_1_2","interpreter":""},{"name":"musllinux-aarch64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","manylinux":"musllinux_1_2","interpreter":""},{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","interpreter":"python"},{"name":"macos-x86_64","os":"macos-15-intel","target":"x86_64-apple-darwin","interpreter":"python"},{"name":"windows-x86_64","os":"windows-latest","target":"x86_64-pc-windows-msvc","interpreter":"python"},{"name":"windows-arm64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc","interpreter":"python"}]'
          || '[{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","manylinux":"auto","interpreter":"python3.13"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # manylinux containers do not see setup-python's interpreter, so
          # select the matching container Python explicitly. musllinux cross
          # images autodetect it; the wheel is stable-ABI either way.
          args: --release --out dist ${{ matrix.interpreter && format('--interpreter {0}', matrix.interpreter) || '' }}
      - name: Build the sdist
        # One matrix entry builds the source distribution: the tarball is
        # platform independent, so every platform would only duplicate it.
        if: matrix.name == 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  docs:
    name: API docs and docstrings
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the wheel and Sphinx
        run: |
          python -m pip install --no-index --find-links dist matplotvite
          python -m pip install -c .github/requirements-ci.txt "sphinx>=8"
      - name: Check public docstring coverage
        run: python tools/check_docstrings.py
      - name: Build the API reference
        run: python -m sphinx -W -b html docs docs/_build/html

  wheel-tests:
    name: wheel test (py${{ matrix.python }}, ${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    # The wheel is stable-ABI, so the per-interpreter coverage comes from the
    # Linux matrix. Hosted macOS runners are scarce: asking for one per Python
    # version regularly left jobs queued until GitHub cancelled them ~15 minutes
    # later, so macOS checks the newest interpreter only. No timeout setting
    # covers that queue wait; reducing the number of macOS jobs is the fix.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows wheels only exist on tags and release/ branches.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        # Every supported minor (3.9 through 3.14) runs at least once on Linux.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Python 3.9 and 3.10 are no longer available on current hosted
          # macOS/Windows images; the stable-ABI wheel still supports them.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the built wheel
        run: |
          python -m pip install -c .github/requirements-ci.txt numpy pandas pytest pytest-cov hypothesis
          python -m pip install --no-index --find-links dist matplotvite
      - name: Run the test suite against the installed wheel
        # The repo root is not on sys.path ahead of site-packages, so these
        # imports resolve to the installed wheel rather than the source tree.
        # This is the only full-suite run in CI, so a wheel-only break cannot
        # hide behind a `maturin develop` build.
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13'
        run: python -m pytest -q
      - name: Run the Python coverage gate
        # One Linux interpreter owns the coverage report; repeating it on every
        # wheel would only duplicate the same Python source measurement.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pytest -q --cov=matplotvite --cov-branch --cov-report=term

  sdist-wheel:
    name: wheel from sdist
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Build two wheels from the sdist
        # Same PEP 517 path a user gets from `pip install matplotvite` on a
        # platform without a wheel, using the pinned maturin instead of an
        # isolated resolution. Building twice catches non-deterministic output.
        run: |
          python -m pip install -c .github/requirements-ci.txt maturin
          SOURCE_DATE_EPOCH=0 python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheel-a dist/*.tar.gz
          SOURCE_DATE_EPOCH=0 python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheel-b dist/*.tar.gz
          python tools/check_reproducible_wheel.py wheel-a wheel-b
      - name: Check the wheel built from the sdist
        run: |
          python - <<'PY'
          import glob
          import pathlib

          wheels = glob.glob("wheel-a/*.whl")
          assert len(wheels) == 1, wheels
          # The sdist must keep the abi3 configuration, or every interpreter
          # above 3.9 would lose its wheel.
          assert "cp39-abi3" in pathlib.Path(wheels[0]).name, wheels[0]
          print(f"built {wheels[0]}")
          PY
      - name: Install and smoke-test the sdist wheel
        run: |
          python -m pip install -c .github/requirements-ci.txt numpy pytest
          python -m pip install --no-deps wheel-a/*.whl
          python -m pytest -q tests/test_wheel.py

  benchmarks:
    name: benchmark regression guard
    needs: wheels
    runs-on: ubuntu-latest
    # Performance budgets are advisory: benchmark noise should never block CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: wheel
      - name: Run benchmarks and report the regression budget
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt numpy "matplotlib==3.11.2"
          pip install --no-index --no-deps --find-links wheel matplotvite
          python tools/benchmark.py --quick --out dist/benchmarks.json
          python tools/benchmark_guard.py --warn-only dist/benchmarks.json tools/benchmark_baseline.json
          python tools/visual_compare.py dist/visual --json dist/visual_diff.json
      - name: Upload the visual mismatch metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-${{ github.sha }}
          path: |
            dist/visual
            dist/visual_diff.json
          retention-days: 90

  galleries:
    name: gallery (${{ matrix.name }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: corpus
            out: mpl-corpus
          - name: examples
            out: mpl-examples
          - name: seaborn
            out: seaborn-gallery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: wheel
      - name: Build
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt numpy "matplotlib==3.11.2" pypdfium2 cairosvg Pillow
          pip install --no-index --no-deps --find-links wheel matplotvite
      - name: Cache the Matplotlib sdist and tests
        if: matrix.name == 'corpus'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dist/sdist
            dist/mpl-sdist
          key: mpl-sdist-3.11.2
      - name: Cache the Matplotlib examples
        if: matrix.name == 'examples'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/mpl-src
          key: mpl-src-3.11.2
      - name: Cache the Seaborn examples
        if: matrix.name == 'seaborn'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/sns-src
          key: sns-src-0.13.2
      - name: Fetch the Matplotlib sdist
        if: matrix.name == 'corpus'
        run: |
          if find dist/mpl-sdist -path '*/lib/matplotlib/tests' -type d | grep -q .; then
            exit 0
          fi
          pip download --no-binary :all: --no-deps "matplotlib==3.11.2" -d dist/sdist
          mkdir -p dist/mpl-sdist
          tar -xzf dist/sdist/matplotlib-3.11.2.tar.gz -C dist/mpl-sdist
      - name: Fetch the Matplotlib examples
        if: matrix.name == 'examples'
        run: |
          if [ -d dist/mpl-src/galleries/examples ]; then
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse -b v3.11.2 \
            https://github.com/matplotlib/matplotlib dist/mpl-src
          git -C dist/mpl-src sparse-checkout set galleries/examples
      - name: Fetch the Seaborn examples
        if: matrix.name == 'seaborn'
        run: |
          if [ -d dist/sns-src/examples ]; then
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse -b v0.13.2 \
            https://github.com/mwaskom/seaborn dist/sns-src
          git -C dist/sns-src sparse-checkout set examples
      - name: Check the checked-in corpus metadata
        if: matrix.name == 'corpus'
        env:
          MPLBACKEND: Agg
        run: |
          . .venv/bin/activate
          python tools/harvest_matplotlib.py --source dist/mpl-sdist \
            --check-metadata tests/mpl_corpus.json
      - name: Regenerate the baseline gallery
        if: matrix.name == 'corpus'
        env:
          MPLBACKEND: Agg
          SAMPLE_LIMIT: ${{ github.event_name == 'pull_request' && '75' || '' }}
        run: |
          . .venv/bin/activate
          args=()
          if [ -n "$SAMPLE_LIMIT" ]; then args=(--limit "$SAMPLE_LIMIT"); fi
          python tools/harvest_matplotlib.py --out dist/mpl-corpus "${args[@]}"
      - name: Regenerate the examples gallery
        if: matrix.name == 'examples'
        env:
          MPLBACKEND: Agg
          SAMPLE_LIMIT: ${{ github.event_name == 'pull_request' && '75' || '' }}
        run: |
          . .venv/bin/activate
          args=()
          if [ -n "$SAMPLE_LIMIT" ]; then args=(--limit "$SAMPLE_LIMIT"); fi
          python tools/harvest_matplotlib.py --examples dist/mpl-src \
            --out dist/mpl-examples --no-reference "${args[@]}"
      - name: Regenerate the Seaborn gallery
        if: matrix.name == 'seaborn'
        env:
          SAMPLE_LIMIT: ${{ github.event_name == 'pull_request' && '30' || '' }}
        run: |
          . .venv/bin/activate
          args=()
          if [ -n "$SAMPLE_LIMIT" ]; then args=(--limit "$SAMPLE_LIMIT"); fi
          python tools/harvest_seaborn.py --out dist/seaborn-gallery "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gallery-${{ matrix.name }}
          path: dist/${{ matrix.out }}
          retention-days: 90

  gallery-summary:
    name: gallery summary
    needs: galleries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gallery-*
          path: dist
          merge-multiple: true
      - name: Summarise the galleries
        run: python tools/gallery_summary.py --out dist >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galleries-${{ github.sha }}
          path: |
            dist/mpl-corpus
            dist/mpl-examples
            dist/seaborn-gallery
          retention-days: 90

  criterion:
    name: criterion output benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the output-stage Criterion suite
        run: cargo bench -p matplotvite-core --bench render -- --quick
      - name: Report the Criterion budget
        run: python tools/criterion_guard.py --warn-only target/criterion benches/criterion_baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          retention-days: 90

  stubs:
    name: type stubs
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: wheel
      - name: Check the shipped stubs
        # Class stubs stay intentionally partial; stubtest still verifies every
        # declared public name and every signature the stubs expose.
        run: |
          python -m pip install -c .github/requirements-ci.txt numpy mypy
          python -m pip install --no-index --no-deps --find-links wheel matplotvite
          python -m mypy.stubtest matplotvite --ignore-missing-stub

  trace:
    name: coverage trace
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-linux-x86_64
          path: wheel
      - name: Check coverage against baseline
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt numpy "matplotlib==3.11.2"
          pip install --no-index --no-deps --find-links wheel matplotvite
          TRACE_DIR=$(python -c "import matplotlib, pathlib; print(pathlib.Path(matplotlib.__file__).parent / 'tests')")
          python tools/trace_unsupported.py --check "$TRACE_DIR"
