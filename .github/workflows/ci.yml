name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  lint:
    name: python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check python tests tools examples

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run Bandit static analysis
        run: |
          python -m pip install -c .github/requirements-ci.txt "bandit>=1.9" numpy
          python -m bandit -q -r python/matplotvite

      - name: Run dependency and static security checks
        run: |
          python -m pip install -c .github/requirements-ci.txt "pip-audit>=2.9"
          python tools/security_audit.py

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # ubuntu-latest (26.04) has no python-versions build for 3.9 yet, so the
          # oldest supported interpreter runs on 22.04 instead.
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build & Test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt maturin numpy pandas pytest
          maturin develop --release
          pytest -q

  wheels:
    name: wheel (${{ matrix.name }})
    # Release artifacts are only worth minutes of runner time once the code is
    # known to compile, lint and pass the suite on every supported interpreter.
    needs: [prek, lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            interpreter: python3.13
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            interpreter: python
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            interpreter: python
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # The manylinux container does not see setup-python's interpreter, so
          # select the matching container Python explicitly. The wheel is built
          # against the stable ABI (cp39-abi3) and works on every version above 3.9.
          args: --release --out dist --interpreter ${{ matrix.interpreter }}
      - name: Build the sdist
        # One matrix entry builds the source distribution: the tarball is
        # platform independent, so every platform would only duplicate it.
        if: matrix.name == 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'linux-x86_64'
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel-tests:
    name: wheel test (py${{ matrix.python }}, ${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    # The wheel is stable-ABI, so the per-interpreter coverage comes from the
    # Linux matrix. Hosted macOS runners are scarce: asking for one per Python
    # version regularly left jobs queued until GitHub cancelled them ~15 minutes
    # later, so macOS checks the newest interpreter only. No timeout setting
    # covers that queue wait; reducing the number of macOS jobs is the fix.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Python 3.9 and 3.10 are no longer available on current hosted
          # macOS/Windows images; the stable-ABI wheel still supports them.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install the built wheel
        run: |
          python -m pip install -c .github/requirements-ci.txt numpy pandas pytest
          python -m pip install --no-index --find-links dist matplotvite
      - name: Run the test suite against the installed wheel
        # The repo root is not on sys.path ahead of site-packages, so these
        # imports resolve to the installed wheel rather than the source tree.
        # Keep this the same suite the `test` job runs, so a wheel-only break
        # cannot hide behind a `maturin develop` build.
        run: python -m pytest -q

  sdist-wheel:
    name: wheel from sdist
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Build a wheel from the sdist
        # Same PEP 517 path a user gets from `pip install matplotvite` on a
        # platform without a wheel, using the pinned maturin instead of an
        # isolated resolution.
        run: |
          python -m pip install -c .github/requirements-ci.txt maturin
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheel dist/*.tar.gz
      - name: Check the wheel built from the sdist
        run: |
          python - <<'PY'
          import glob
          import pathlib

          wheels = glob.glob("wheel/*.whl")
          assert len(wheels) == 1, wheels
          # The sdist must keep the abi3 configuration, or every interpreter
          # above 3.9 would lose its wheel.
          assert "cp39-abi3" in pathlib.Path(wheels[0]).name, wheels[0]
          print(f"built {wheels[0]}")
          PY
      - name: Install and smoke-test the sdist wheel
        run: |
          python -m pip install -c .github/requirements-ci.txt numpy pytest
          python -m pip install --no-deps wheel/*.whl
          python -m pytest -q tests/test_wheel.py

  benchmarks:
    name: benchmark regression guard
    runs-on: ubuntu-latest
    # Performance budgets are advisory: benchmark noise should never block CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run benchmarks and report the regression budget
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt maturin numpy "matplotlib==3.11.2"
          maturin develop --release
          python tools/benchmark.py --quick --out dist/benchmarks.json
          python tools/benchmark_guard.py --warn-only dist/benchmarks.json tools/benchmark_baseline.json
          python tools/visual_compare.py dist/visual --json dist/visual_diff.json
      - name: Upload the visual mismatch metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-${{ github.sha }}
          path: |
            dist/visual
            dist/visual_diff.json
          retention-days: 90

  galleries:
    name: comparison galleries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt maturin numpy "matplotlib==3.11.2" pypdfium2 cairosvg
          maturin develop --release
      - name: Fetch the harvested sources
        run: |
          pip download --no-binary :all: --no-deps "matplotlib==3.11.2" -d dist/sdist
          mkdir -p dist/mpl-sdist
          tar -xzf dist/sdist/matplotlib-3.11.2.tar.gz -C dist/mpl-sdist
          git clone --depth 1 --filter=blob:none --sparse -b v3.11.2 \
            https://github.com/matplotlib/matplotlib dist/mpl-src
          git -C dist/mpl-src sparse-checkout set galleries/examples
          git clone --depth 1 --filter=blob:none --sparse -b v0.13.2 \
            https://github.com/mwaskom/seaborn dist/sns-src
          git -C dist/sns-src sparse-checkout set examples
      - name: Regenerate the galleries
        env:
          MPLBACKEND: Agg
        run: |
          . .venv/bin/activate
          python tools/harvest_matplotlib.py --out dist/mpl-corpus
          python tools/harvest_matplotlib.py --examples dist/mpl-src --out dist/mpl-examples
          python tools/harvest_seaborn.py --out dist/seaborn-gallery
      - name: Summarise the galleries
        run: |
          . .venv/bin/activate
          python tools/gallery_summary.py --out dist >> "$GITHUB_STEP_SUMMARY"

  criterion:
    name: criterion output benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the output-stage Criterion suite
        run: cargo bench --bench render -- --quick
      - name: Report the Criterion budget
        run: python tools/criterion_guard.py --warn-only target/criterion benches/criterion_baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          retention-days: 90

  trace:
    name: coverage trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check coverage against baseline
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt maturin numpy "matplotlib==3.11.2"
          maturin develop --release
          TRACE_DIR=$(python -c "import matplotlib, pathlib; print(pathlib.Path(matplotlib.__file__).parent / 'tests')")
          python tools/trace_unsupported.py --check "$TRACE_DIR"
