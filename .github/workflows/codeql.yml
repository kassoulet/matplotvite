name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from the Scorecard run so the two do not start together.
    - cron: "17 3 * * 2"

permissions: read-all

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Alerts are written through code scanning; the checkout only reads.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python shims, the Rust renderer and the workflows themselves are
          # all in scope. Python and Rust build no database from a compile step,
          # and `actions` has no build at all, so every entry uses `none`.
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          # Keeps each language's results in their own category, so a later
          # run only replaces the alerts of the language it re-analysed.
          category: "/language:${{ matrix.language }}"
