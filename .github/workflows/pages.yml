name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Example Gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build matplotvite
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -c .github/requirements-ci.txt maturin numpy pandas "matplotlib==3.11.2" pypdfium2 cairosvg
          maturin develop --release

      - name: Fetch the harvested sources
        run: |
          . .venv/bin/activate
          mkdir -p /tmp/mpl-sdist /tmp/sdist
          pip download --no-binary :all: --no-deps "matplotlib==3.11.2" -d /tmp/sdist
          tar -xzf /tmp/sdist/matplotlib-3.11.2.tar.gz -C /tmp/mpl-sdist
          git clone --depth 1 --filter=blob:none --sparse -b v3.11.2 \
            https://github.com/matplotlib/matplotlib /tmp/mpl-src
          git -C /tmp/mpl-src sparse-checkout set galleries/examples
          git clone --depth 1 --filter=blob:none --sparse -b v0.13.2 \
            https://github.com/mwaskom/seaborn /tmp/sns-src
          git -C /tmp/sns-src sparse-checkout set examples

      - name: Generate comparison galleries
        env:
          MPLBACKEND: Agg
        run: |
          . .venv/bin/activate
          python tools/harvest_matplotlib.py --source /tmp/mpl-sdist --out dist/mpl-corpus
          python tools/harvest_matplotlib.py --examples /tmp/mpl-src --out dist/mpl-examples
          python tools/harvest_seaborn.py --source /tmp/sns-src --out dist/seaborn-gallery
          python tools/visual_compare.py dist/visual-svg --format svg
          # Built after the galleries so the coverage section can summarise them.
          python tools/build_pages.py --out dist

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
