# PDF output assembles svg2pdf/usvg chunks by hand. When either crate changes,
# run the tight-PDF tests in tests/test_plt.py before merging the update.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
