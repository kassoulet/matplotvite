[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "matplotvite"
# Cargo.toml is the single version source; maturin reads it through the
# dynamic metadata field.
dynamic = ["version"]
description = "Matplotlib-style static plots rendered in Rust, with numpy as the only Python dependency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "assets/fonts/LICENSE_DEJAVU.txt",
                 "assets/fonts/LICENSE_GEIST_OFL.txt"]
authors = [{ name = "Gautier Portet", email = "kassoulet@gmail.com" }]
keywords = ["matplotlib", "plotting", "charts", "svg", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]  # numpy only; no matplotlib, no Pillow

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5", "mypy==1.19.1", "pandas"]

[project.urls]
Homepage = "https://kassoulet.github.io/matplotvite/"
Documentation = "https://kassoulet.github.io/matplotvite/"
Repository = "https://github.com/kassoulet/matplotvite"
Issues = "https://github.com/kassoulet/matplotvite/issues"
Changelog = "https://github.com/kassoulet/matplotvite/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes, syntax/runtime errors, import sorting, bugbear, pyupgrade and the
# Ruff-specific correctness rules. The drawing code uses a deliberately
# compact one-statement-per-line style, so formatting rules are not enforced.
select = ["F", "E9", "I", "B", "UP", "RUF"]
ignore = [
    # Labels and mathtext intentionally use Greek letters and symbols.
    "RUF001",
    # Explicit int() conversions document pixel/raster boundaries.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack both handles for readability even when only axes is used.
"tests/**" = ["RUF059"]

[tool.mypy]
files = ["python/matplotvite"]
python_version = "3.9"
mypy_path = "python"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# `pytest` inserts only the test directory on sys.path, so bare invocations (CI)
# could not import the repo-local `tools` and `examples` packages.
pythonpath = ["."]
# Regenerating the full galleries takes minutes and needs checkouts that are not
# vendored, so those tests only run on request: `pytest -m gallery`.
markers = [
    "gallery: regenerate a full comparison gallery from a local checkout (run with `pytest -m gallery`)",
]

[tool.maturin.sbom]
# The generated Rust SBOM records pip's temporary build directory, which makes
# otherwise identical wheels differ. Release artifacts carry an SPDX SBOM.
rust = false

[tool.maturin]
python-source = "python"
module-name = "matplotvite._core"
# Keep the sdist buildable but free of development-only trees. The fonts under
# assets/fonts must stay because src/fonts.rs embeds them with include_bytes!.
exclude = [
    "benches/**",
    "tools/**",
    ".github/**",
    ".jules/**",
    ".freebuff/**",
    "review.md",
]
