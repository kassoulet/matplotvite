[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "matplotvite"
# Cargo.toml is the single version source; maturin reads it through the
# dynamic metadata field.
dynamic = ["version"]
description = "Matplotlib-style static plots rendered in Rust, with numpy as the only Python dependency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "assets/fonts/LICENSE_DEJAVU.txt",
                 "assets/fonts/LICENSE_GEIST_OFL.txt"]
authors = [{ name = "Gautier Portet", email = "kassoulet@gmail.com" }]
keywords = ["matplotlib", "plotting", "charts", "svg", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]  # numpy only; no matplotlib, no Pillow

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    # Hypothesis 6.170 requires Python 3.11; keep the 3.9/3.10 resolution on
    # the last release that supports them.
    "hypothesis==6.100.0; python_version < '3.11'",
    "hypothesis>=6.100; python_version >= '3.11'",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pandas",
]

test = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis==6.100.0; python_version < '3.11'",
    "hypothesis>=6.100; python_version >= '3.11'",
    "pandas",
]
docs = ["sphinx>=8"]

[project.urls]
Homepage = "https://kassoulet.github.io/matplotvite/"
Documentation = "https://kassoulet.github.io/matplotvite/"
Repository = "https://github.com/kassoulet/matplotvite"
Issues = "https://github.com/kassoulet/matplotvite/issues"
Changelog = "https://github.com/kassoulet/matplotvite/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes, syntax/runtime errors, import sorting, bugbear, pyupgrade and the
# Ruff-specific correctness rules. The drawing code uses a deliberately
# compact one-statement-per-line style, so formatting rules are not enforced.
select = ["F", "E9", "I", "B", "UP", "RUF", "S", "SIM", "PERF"]
ignore = [
    # Labels and mathtext intentionally use Greek letters and symbols.
    "RUF001",
    # Explicit int() conversions document pixel/raster boundaries.
    "RUF046",
    # Ternaries and extend() rewrites of the compact drawing code are style
    # churn, not correctness; the rest of SIM and PERF stay on.
    "SIM108",
    "PERF401",
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack both handles for readability even when only axes is used, rely
# on assert, and run fixed argument lists through subprocess.
"tests/**" = ["RUF059", "S101", "S102", "S603", "S607"]
# Build tools run fixed argument lists (never a shell) and exec repo-owned
# gallery snippets; bandit is configured the same way in security_audit.py.
"tools/**" = ["S102", "S603", "S607"]

[tool.mypy]
files = ["python/matplotvite"]
python_version = "3.9"
mypy_path = "python"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Typed bodies only checked signatures before; check untyped ones too. Known
# findings carry an explicit `type: ignore[code]` to be burned down over time.
check_untyped_defs = true

[tool.coverage.run]
# Branch coverage catches the short-circuit paths in the drawing helpers that
# line coverage alone would report as exercised.
branch = true
source = ["matplotvite"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.pytest.ini_options]
# `pytest` inserts only the test directory on sys.path, so bare invocations (CI)
# could not import the repo-local `tools` and `examples` packages.
pythonpath = ["."]
# Regenerating the full galleries takes minutes and needs checkouts that are not
# vendored, so those tests only run on request: `pytest -m gallery`.
markers = [
    "gallery: regenerate a full comparison gallery from a local checkout (run with `pytest -m gallery`)",
]

[tool.maturin.sbom]
# The generated Rust SBOM records pip's temporary build directory, which makes
# otherwise identical wheels differ. Release artifacts carry an SPDX SBOM.
rust = false

[tool.maturin]
manifest-path = "crates/matplotvite-py/Cargo.toml"
python-source = "python"
# The workspace manifest names every member, so the sdist must carry the
# builder crate and the shared golden test target as well as the renderer's
# embedded font files.
include = [
    { path = "assets/fonts/*.ttf", format = "sdist" },
    { path = "crates/matplotvite/Cargo.toml", format = "sdist" },
    { path = "crates/matplotvite/src/**/*", format = "sdist" },
    { path = "tests/golden.rs", format = "sdist" },
    { path = "tests/golden/*.png", format = "sdist" },
    { path = "tests/golden/scenes.txt", format = "sdist" },
]
module-name = "matplotvite._core"
# Keep the sdist buildable but free of development-only trees. The fonts under
# assets/fonts must stay because src/fonts.rs embeds them with include_bytes!.
exclude = [
    "benches/**",
    "fuzz/**",
    "tools/**",
    ".github/**",
    ".jules/**",
    ".freebuff/**",
    "review.md",
]
