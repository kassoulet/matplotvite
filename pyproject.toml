[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "plt-rs"
version = "0.1.0"
description = "Matplotlib-style static plots rendered in Rust, with numpy as the only Python dependency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Gautier Portet", email = "kassoulet@gmail.com" }]
keywords = ["matplotlib", "plotting", "charts", "svg", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]  # numpy only; no matplotlib, no Pillow

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4"]

[project.urls]
Homepage = "https://kassoulet.github.io/plt_rs/"
Repository = "https://github.com/kassoulet/plt_rs"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes plus syntax/runtime errors. The drawing code uses a deliberately
# compact one-statement-per-line style, so formatting rules are not enforced.
select = ["F", "E9"]

[tool.pytest.ini_options]
# `pytest` inserts only the test directory on sys.path, so bare invocations (CI)
# could not import the repo-local `tools` and `examples` packages.
pythonpath = ["."]

[tool.maturin]
python-source = "python"
module-name = "plt_rs._core"
