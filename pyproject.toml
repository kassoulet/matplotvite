[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "matplotvite"
version = "0.6.1-dev"
description = "Matplotlib-style static plots rendered in Rust, with numpy as the only Python dependency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "assets/fonts/LICENSE_DEJAVU.txt",
                 "assets/fonts/LICENSE_GEIST_OFL.txt"]
authors = [{ name = "Gautier Portet", email = "kassoulet@gmail.com" }]
keywords = ["matplotlib", "plotting", "charts", "svg", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]  # numpy only; no matplotlib, no Pillow

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4", "pandas"]

[project.urls]
Homepage = "https://kassoulet.github.io/matplotvite/"
Repository = "https://github.com/kassoulet/matplotvite"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pyflakes plus syntax/runtime errors. The drawing code uses a deliberately
# compact one-statement-per-line style, so formatting rules are not enforced.
select = ["F", "E9"]

[tool.pytest.ini_options]
# `pytest` inserts only the test directory on sys.path, so bare invocations (CI)
# could not import the repo-local `tools` and `examples` packages.
pythonpath = ["."]
# Regenerating the full galleries takes minutes and needs checkouts that are not
# vendored, so those tests only run on request: `pytest -m gallery`.
markers = [
    "gallery: regenerate a full comparison gallery from a local checkout (run with `pytest -m gallery`)",
]

[tool.maturin]
python-source = "python"
module-name = "matplotvite._core"
