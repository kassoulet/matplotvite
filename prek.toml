# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "mixed-line-ending" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"
hooks = [
  { id = "ruff-check" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "bandit", name = "bandit", entry = "python -m bandit -q -r python/matplotvite tools -s B404,B603,B607,B105", language = "python", additional_dependencies = ["bandit>=1.9"], pass_filenames = false },
  { id = "vulture", name = "vulture dead code", entry = "python tools/dead_code.py", language = "python", additional_dependencies = ["vulture>=2.14"], pass_filenames = false },
  { id = "cargo-fmt", name = "cargo fmt --check", entry = "cargo fmt --all -- --check", language = "system", pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets -- -D warnings", language = "system", pass_filenames = false },
  { id = "cargo-test", name = "cargo test", entry = "cargo test --all-targets", language = "system", pass_filenames = false, stages = ["pre-push"] },
  # Builds the extension first so the tests never run against a stale binary.
  { id = "pytest", name = "pytest", entry = "sh -c 'maturin develop --release -q && python -m pytest -q'", language = "system", pass_filenames = false, stages = ["pre-push"] },
  { id = "security-audit", name = "security audit", entry = "python tools/security_audit.py", language = "python", additional_dependencies = ["bandit>=1.9", "pip-audit>=2.9", "numpy"], pass_filenames = false, stages = ["pre-push"] },
  # CI always runs trivy; locally it only runs when the binary is installed.
  { id = "trivy", name = "trivy fs", entry = "sh -c 'if command -v trivy >/dev/null; then trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs target,fuzz/target,.venv --exit-code 1 --quiet .; else echo trivy not installed, CI runs it; fi'", language = "system", pass_filenames = false, stages = ["pre-push"] },
  { id = "no-co-authored-by", name = "reject Co-Authored-By trailers", entry = "python tools/check_commit_message.py", language = "python", stages = ["commit-msg"] },
]
