# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "mixed-line-ending" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"
hooks = [
  { id = "ruff-check" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt --check", entry = "cargo fmt --all -- --check", language = "system", pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets -- -D warnings", language = "system", pass_filenames = false },
  { id = "cargo-test", name = "cargo test", entry = "cargo test --all-targets", language = "system", pass_filenames = false },
  # Builds the extension first so the tests never run against a stale binary.
  { id = "pytest", name = "pytest", entry = "sh -c 'maturin develop --release -q && python -m pytest -q'", language = "system", pass_filenames = false, stages = ["pre-push"] },
  { id = "security-audit", name = "security audit", entry = "python tools/security_audit.py", language = "python", additional_dependencies = ["bandit>=1.9", "pip-audit>=2.9", "numpy"], pass_filenames = false, stages = ["pre-push"] },
  { id = "no-co-authored-by", name = "reject Co-Authored-By trailers", entry = "python tools/check_commit_message.py", language = "python", stages = ["commit-msg"] },
]
